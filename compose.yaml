services:
  app:
    build:
      context: .
    environment:
      TRAIN_DATA_DIR: /data
      TRAIN_AUTH_ENABLED: "1"
      TRAIN_AUTH_USERNAME: ${TRAIN_AUTH_USERNAME:-}
      TRAIN_AUTH_PASSWORD_HASH: ${TRAIN_AUTH_PASSWORD_HASH:-}
      TRAIN_SESSION_SECRET: ${TRAIN_SESSION_SECRET:-}
      TRAIN_COOKIE_SECURE: ${TRAIN_COOKIE_SECURE:-1}
      TRAIN_TRUST_PROXY: "1"
      TRAIN_SSO_SESSION_URL: ${TRAIN_SSO_SESSION_URL:-}
      TRAIN_SSO_LOGOUT_URL: ${TRAIN_SSO_LOGOUT_URL:-}
      TRAIN_SSO_LOGIN_URL: ${TRAIN_SSO_LOGIN_URL:-}
      TRAIN_SSO_PUBLIC_ORIGIN: ${TRAIN_SSO_PUBLIC_ORIGIN:-}
      TRAIN_SSO_COOKIE_NAME: ${TRAIN_SSO_COOKIE_NAME:-__Secure-jerry_session}
      TRAIN_SSO_COOKIE_DOMAIN: ${TRAIN_SSO_COOKIE_DOMAIN:-.jerrythelpaca.cn}
    volumes:
      - ${HOST_DATA_DIR:-/opt/footpoint-atlas-data}:/data
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - jerry-sites

  web:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/nginx.conf.template:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/healthz
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true

networks:
  jerry-sites:
    external: true
    name: jerry-sites
