<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的火车足迹</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="boot-error" class="boot-error" hidden></div>

  <div class="scale-stage">
    <div class="app">
    <header class="header">
      <div class="title-wrap">
        <h1>我的火车足迹</h1>
        <div class="title-actions">
          <button id="review-btn" type="button">年度回顾</button>
          <button id="settings-btn" type="button">设置</button>
        </div>
      </div>
      <div class="stat-cards">
        <article class="stat-card">
          <span class="stat-label">总乘坐次数</span>
          <strong id="stat-rides" class="stat-value">0</strong>
        </article>
        <article class="stat-card">
          <span class="stat-label">到访车站</span>
          <strong id="stat-stations" class="stat-value">0</strong>
        </article>
        <article class="stat-card">
          <span class="stat-label">车型数</span>
          <strong id="stat-vehicles" class="stat-value">0</strong>
        </article>
      </div>
    </header>

    <main class="main">
      <section class="map-panel">
        <div class="map-frame">
          <div class="map-viewport">
            <div id="map-chart" class="chart map-chart"></div>
          </div>
        </div>
        <button id="map-explore-btn" class="map-explore-btn" type="button" aria-pressed="false">探索地图</button>
        <div class="timeline">
          <div class="timeline-filter">
            <label for="range-mode-button">回放范围</label>
            <div id="range-mode-control" class="range-mode-select">
              <select id="range-mode" hidden aria-hidden="true" tabindex="-1">
                <option value="all">全部</option>
                <option value="year">按年份</option>
                <option value="custom">自定义时间段</option>
              </select>
              <button id="range-mode-button" class="range-select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="range-mode-menu">
                <span id="range-mode-text">全部</span>
                <span class="range-select-arrow" aria-hidden="true"></span>
              </button>
              <div id="range-mode-menu" class="range-select-menu" role="listbox" aria-label="回放范围" hidden>
                <button type="button" class="range-select-option is-selected" role="option" data-value="all" aria-selected="true">
                  <span>全部</span><span class="range-select-check" aria-hidden="true"></span>
                </button>
                <button type="button" class="range-select-option" role="option" data-value="year" aria-selected="false">
                  <span>按年份</span><span class="range-select-check" aria-hidden="true"></span>
                </button>
                <button type="button" class="range-select-option" role="option" data-value="custom" aria-selected="false">
                  <span>自定义时间段</span><span class="range-select-check" aria-hidden="true"></span>
                </button>
              </div>
            </div>
            <div id="range-year-control" class="range-year-select" hidden>
              <select id="range-year" hidden aria-hidden="true" tabindex="-1"></select>
              <button id="range-year-button" class="range-select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="range-year-menu">
                <span id="range-year-text"></span>
                <span class="range-select-arrow" aria-hidden="true"></span>
              </button>
              <div id="range-year-menu" class="range-select-menu range-year-menu" role="listbox" aria-label="回放年份" hidden></div>
            </div>
            <div id="range-custom" class="range-custom" hidden>
              <div class="date-field range-date-field">
                <input id="range-start" type="text" inputmode="numeric" placeholder="年-月-日" autocomplete="off" maxlength="10" aria-label="开始日期">
                <button id="range-start-toggle" type="button" class="date-picker-toggle" aria-label="打开日历" aria-haspopup="dialog" aria-expanded="false">
                  <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                    <rect x="1.5" y="3" width="13" height="11.5" rx="2" fill="none" stroke="currentColor"></rect>
                    <path d="M1.5 6.5h13M5 1.5v3M11 1.5v3" fill="none" stroke="currentColor"></path>
                  </svg>
                </button>
                <div id="range-start-picker" class="date-picker" hidden role="dialog" aria-label="选择开始日期">
                  <div class="date-picker-head">
                    <button type="button" class="date-picker-nav" data-cal-nav="-1" aria-label="上个月">‹</button>
                    <span class="date-picker-title"></span>
                    <button type="button" class="date-picker-nav" data-cal-nav="1" aria-label="下个月">›</button>
                  </div>
                  <div class="date-picker-weekdays"></div>
                  <div class="date-picker-grid"></div>
                </div>
              </div>
              <span class="range-custom-sep" aria-hidden="true">→</span>
              <div class="date-field range-date-field">
                <input id="range-end" type="text" inputmode="numeric" placeholder="年-月-日" autocomplete="off" maxlength="10" aria-label="结束日期">
                <button id="range-end-toggle" type="button" class="date-picker-toggle" aria-label="打开日历" aria-haspopup="dialog" aria-expanded="false">
                  <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                    <rect x="1.5" y="3" width="13" height="11.5" rx="2" fill="none" stroke="currentColor"></rect>
                    <path d="M1.5 6.5h13M5 1.5v3M11 1.5v3" fill="none" stroke="currentColor"></path>
                  </svg>
                </button>
                <div id="range-end-picker" class="date-picker" hidden role="dialog" aria-label="选择结束日期">
                  <div class="date-picker-head">
                    <button type="button" class="date-picker-nav" data-cal-nav="-1" aria-label="上个月">‹</button>
                    <span class="date-picker-title"></span>
                    <button type="button" class="date-picker-nav" data-cal-nav="1" aria-label="下个月">›</button>
                  </div>
                  <div class="date-picker-weekdays"></div>
                  <div class="date-picker-grid"></div>
                </div>
              </div>
            </div>
            <div class="type-filter" role="group" aria-label="列车类别筛选">
              <button type="button" class="type-filter-btn" data-type="all">全部</button>
              <button type="button" class="type-filter-btn" data-type="emu"><span class="swatch swatch-emu"></span>动车</button>
              <button type="button" class="type-filter-btn" data-type="conv"><span class="swatch swatch-conv"></span>普速</button>
            </div>
          </div>
          <div class="timeline-controls">
            <button id="play-btn" type="button" aria-label="播放或暂停时间轴">播放</button>
            <input id="time-slider" type="range" min="0" value="0">
            <span id="time-label">准备回放</span>
          </div>
        </div>
      </section>

      <aside class="side-panel">
        <section class="ranking-scene">
        <section class="chart-block">
          <h2>车型排行</h2>
          <div class="rank-clip">
            <div id="vehicle-chart" class="chart side-chart"></div>
          </div>
          <button type="button" class="rank-toggle" aria-expanded="false" aria-label="展开车型排行">
            <span class="rank-toggle-arrow" aria-hidden="true"></span>
          </button>
        </section>
        <section class="chart-block">
          <h2>车站排行</h2>
          <div class="rank-clip">
            <div id="station-chart" class="chart side-chart"></div>
          </div>
          <button type="button" class="rank-toggle" aria-expanded="false" aria-label="展开车站排行">
            <span class="rank-toggle-arrow" aria-hidden="true"></span>
          </button>
        </section>
        <section class="chart-block">
          <h2>路局排行</h2>
          <div class="rank-clip">
            <div id="bureau-chart" class="chart side-chart"></div>
          </div>
          <button type="button" class="rank-toggle" aria-expanded="false" aria-label="展开路局排行">
            <span class="rank-toggle-arrow" aria-hidden="true"></span>
          </button>
        </section>
        </section>
        <section class="reunion-scene" hidden>
        <section id="reunion-block" class="chart-block reunion-block" hidden>
          <h2>相遇重逢</h2>
          <div id="reunion-summary" class="reunion-summary">
            <span id="reunion-vehicle-summary" class="reunion-summary-item" hidden>
              同一列车 <strong class="reunion-summary-count">0</strong>
            </span>
            <span id="reunion-train-summary" class="reunion-summary-item" hidden>
              同一车次 <strong class="reunion-summary-count">0</strong>
            </span>
          </div>
          <div id="reunion-details" class="reunion-details" hidden>
            <div id="reunion-vehicles" class="reunion-group" hidden>
              <h3 class="reunion-group-title">同一列车</h3>
              <ul id="reunion-vehicle-list" class="reunion-list"></ul>
            </div>
            <div id="reunion-trains" class="reunion-group" hidden>
              <h3 class="reunion-group-title">同一车次</h3>
              <ul id="reunion-train-list" class="reunion-list"></ul>
            </div>
          </div>
          <button type="button" class="rank-toggle reunion-toggle" aria-expanded="false" aria-label="展开相遇重逢">
            <span class="rank-toggle-arrow" aria-hidden="true"></span>
          </button>
        </section>
        </section>
        <section class="record-scene">
        <section class="record-panel">
          <div class="record-panel-head">
            <h2>行程数据</h2>
            <button id="add-trip-btn" type="button">添加行程</button>
          </div>
          <ol id="record-list" class="record-list"></ol>
        </section>
        </section>
      </aside>
    </main>

    <section id="mobile-page-footprint" class="mobile-story-page mobile-story-page-footprint mobile-scene" data-scene="footprint" hidden></section>
    <section id="mobile-page-insights" class="mobile-story-page mobile-story-page-insights mobile-scene" data-scene="insights" hidden></section>
    <section id="mobile-page-records" class="mobile-story-page mobile-story-page-records mobile-scene" data-scene="records" hidden></section>

    <div id="review-modal" class="review-modal" hidden>
      <div class="review-backdrop" data-review-close></div>
      <div class="review-dialog" role="dialog" aria-modal="true" aria-labelledby="review-title">
        <div class="review-header">
          <h2 id="review-title">年度回顾</h2>
          <button id="review-close" type="button" aria-label="关闭年度回顾">×</button>
        </div>
        <div id="review-years" class="review-years"></div>
        <div class="review-cards">
          <article class="review-card">
            <span class="stat-label">乘坐次数</span>
            <strong id="review-rides" class="stat-value">0</strong>
          </article>
          <article class="review-card">
            <span class="stat-label">到访车站</span>
            <strong id="review-stations" class="stat-value">0</strong>
          </article>
          <article class="review-card">
            <span class="stat-label">最常到访车站</span>
            <strong id="review-top-station" class="stat-value review-text">-</strong>
            <span id="review-top-station-count" class="stat-note"></span>
          </article>
          <article class="review-card">
            <span class="stat-label">最常乘坐线路</span>
            <strong id="review-top-route" class="stat-value review-text">-</strong>
            <span id="review-top-train" class="stat-note"></span>
          </article>
        </div>
        <div class="review-actions">
          <button id="review-play" type="button">▶ 回放这一年</button>
        </div>
      </div>
    </div>

    <div id="settings-modal" class="settings-modal" hidden>
      <div class="settings-backdrop" data-settings-close></div>
      <div class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="settings-header">
          <h2 id="settings-title">设置</h2>
          <button id="settings-close" type="button" aria-label="关闭设置">×</button>
        </div>
        <div class="settings-body">
          <nav id="settings-nav" class="settings-nav" aria-label="设置分类">
            <button type="button" class="settings-nav-btn is-active" data-panel="trip">添加行程</button>
          </nav>
          <div class="settings-panels">
            <section id="settings-panel-trip" class="settings-panel" data-panel="trip">
              <form id="trip-form">
                <div class="trip-grid">
                  <div class="trip-date-wrap">
                    <label for="trip-date">日期</label>
                    <div class="date-field">
                      <input id="trip-date" name="date" type="text" inputmode="numeric" placeholder="年-月-日" required autocomplete="off" maxlength="10">
                      <button id="trip-date-toggle" type="button" class="date-picker-toggle" aria-label="打开日历" aria-haspopup="dialog" aria-expanded="false">
                        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                          <rect x="1.5" y="3" width="13" height="11.5" rx="2" fill="none" stroke="currentColor"></rect>
                          <path d="M1.5 6.5h13M5 1.5v3M11 1.5v3" fill="none" stroke="currentColor"></path>
                        </svg>
                      </button>
                      <div id="trip-date-picker" class="date-picker" hidden role="dialog" aria-label="选择日期">
                        <div class="date-picker-head">
                          <button type="button" class="date-picker-nav" data-cal-nav="-1" aria-label="上个月">‹</button>
                          <span class="date-picker-title"></span>
                          <button type="button" class="date-picker-nav" data-cal-nav="1" aria-label="下个月">›</button>
                        </div>
                        <div class="date-picker-weekdays"></div>
                        <div class="date-picker-grid"></div>
                      </div>
                    </div>
                  </div>
                  <label>车次
                    <input id="trip-train" name="train" type="text" required autocomplete="off">
                  </label>
                  <label>出发站
                    <input id="trip-from" name="from" type="text" list="station-list" required autocomplete="off">
                  </label>
                  <label>到达站
                    <input id="trip-to" name="to" type="text" list="station-list" required autocomplete="off">
                  </label>
                </div>
                <div class="trip-grid trip-grid-more">
                  <label>车型 / 车号
                    <input id="trip-vehicle" name="vehicle" type="text" autocomplete="off">
                  </label>
                  <label>担当路局
                    <input id="trip-bureau" name="bureau" type="text" list="bureau-list" autocomplete="off">
                  </label>
                  <label>车次始发
                    <input id="trip-origin" name="origin" type="text" list="station-list" autocomplete="off">
                  </label>
                  <label>车次终到
                    <input id="trip-terminal" name="terminal" type="text" list="station-list" autocomplete="off">
                  </label>
                </div>
                <div id="trip-unknown-stations" class="trip-unknown" hidden>
                  <p class="settings-hint">以下车站尚未收录坐标，补上后才能画到地图上；也可先不填，记录仍会保存。</p>
                  <div id="trip-unknown-fields"></div>
                </div>
                <div class="trip-actions">
                  <p id="trip-form-status" class="trip-status" role="status"></p>
                  <button id="trip-submit" type="submit">添加行程</button>
                </div>
              </form>
            </section>
          </div>
        </div>
      </div>
    </div>
    <datalist id="station-list"></datalist>
    <datalist id="bureau-list"></datalist>
    </div>
  </div>

  <div class="scanlines" aria-hidden="true"></div>

  <div id="record-action-sheet" class="record-action-sheet" hidden>
    <div class="record-action-backdrop" data-record-action-close></div>
    <div class="record-action-dialog" role="dialog" aria-modal="true" aria-labelledby="record-action-title">
      <div class="record-action-handle" aria-hidden="true"></div>
      <h2 id="record-action-title">记录操作</h2>
      <button type="button" data-action="edit">编辑</button>
      <button type="button" data-action="delete">删除</button>
      <button type="button" class="record-action-cancel" data-record-action-close>取消</button>
    </div>
  </div>

  <div id="record-context-menu" class="record-context-menu" hidden role="menu" aria-label="记录操作">
    <button type="button" role="menuitem" data-action="edit">编辑</button>
    <button type="button" role="menuitem" data-action="delete">删除</button>
  </div>

  <script src="lib/echarts.min.js"></script>
  <script src="map/china.js"></script>
  <script src="js/data.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/scale.js"></script>
  <script src="js/mobile-layout.js"></script>
  <script src="js/mobile-animations.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
